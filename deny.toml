# cargo-deny configuration for the oracles workspace.
#
# Run with: `cargo deny --workspace check`
# Install with: `cargo install --locked cargo-deny`
#
# This config focuses on what matters for an oracle binary that holds keypairs
# and listens on the network: license compliance, RUSTSEC advisories, and
# basic supply-chain hygiene. Duplicates / version skew are warnings (large
# Solana SDKs pull in plenty of legitimate dupes) rather than failures.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---- Licenses ---------------------------------------------------------------
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "ring"

# ---- Advisories -------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []

# ---- Bans -------------------------------------------------------------------
# Keep this section minimal — we don't want to fight the Solana SDK's
# legitimate version dispersion. Add specific bans here if a known-bad crate
# slips into the dependency graph.
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []

# ---- Sources ----------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
