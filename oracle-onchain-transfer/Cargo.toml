[package]
name = "oracle-onchain-transfer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "On-chain SPL transfer / swap oracle (x402/oracles/onchain-transfer/v1)"
keywords = ["x402", "oracle", "sla", "spl", "solana"]
categories = ["web-programming", "cryptography"]

[[bin]]
name = "oracle-onchain-transfer"
path = "src/main.rs"

[features]
default = []
devnet = ["oracle-common/devnet"]

[dependencies]
oracle-common = { workspace = true }
sla-escrow-api = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
deadpool-postgres = { workspace = true }
postgres-openssl = { workspace = true }
openssl = { workspace = true }
reqwest = { workspace = true }
solana-client = { workspace = true }
solana-sdk = { workspace = true }
solana-transaction-status = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
spl-token = { workspace = true }
spl-associated-token-account = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
