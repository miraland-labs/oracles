[package]
name = "oracle-api-quality"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "JSON-shaped SLA quality oracle (x402/oracles/api-quality/v1)"
keywords = ["x402", "oracle", "sla", "api-quality", "solana"]
categories = ["web-programming", "cryptography"]

[[bin]]
name = "oracle-api-quality"
path = "src/main.rs"

[features]
default = []
devnet = ["oracle-common/devnet"]

[dependencies]
oracle-common = { workspace = true }
sla-escrow-api = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
deadpool-postgres = { workspace = true }
postgres-openssl = { workspace = true }
openssl = { workspace = true }
reqwest = { workspace = true }
solana-client = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
jsonschema = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
