# Reference nginx site for an x402 oracle. Copy to
# /etc/nginx/sites-available/oracle-<family>, edit the server_name and
# certificate paths, symlink into sites-enabled, reload.
#
# Adjust to your shop's conventions (TLS cert source, HSTS policy,
# observability sidecars). The only oracle-specific constraints are
# noted inline.

server {
    listen 443 ssl http2;
    server_name oracle-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/oracle-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oracle-api.example.com/privkey.pem;

    # ----- Public endpoints -----

    location = /health  { proxy_pass http://127.0.0.1:4020; }

    # /metrics and /evaluate are operator-only. Restrict at the proxy
    # layer; the oracle itself enforces ORACLE_OPERATOR_TOKEN_SHA256 on
    # /evaluate, but defense in depth is cheap.
    location = /metrics {
        allow 10.0.0.0/8;          # your monitoring CIDR
        deny all;
        proxy_pass http://127.0.0.1:4020;
    }
    location = /evaluate {
        allow 10.0.0.0/8;          # your operator network
        deny all;
        proxy_pass http://127.0.0.1:4020;
    }

    # ----- Seller registration HTTP -----
    #
    # Oracle-specific: registration POSTs include large blob uploads
    # (file-delivery family). Disable request buffering and set the
    # body-size limit at least equal to ORACLE_REGISTRY_MAX_BLOB_BYTES
    # (default 5 GiB) so streaming uploads work.
    location /v1/registry/ {
        client_max_body_size 5G;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:4020;
    }

    # Default deny.
    location / { return 404; }
}
